services:
  # Python FastAPI Backend Web Service
  - type: web
    name: codebase-rag-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # React Vite Frontend Static Site
  - type: static
    name: codebase-rag-frontend
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
